[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h3lper"
description = "Utilities to make h3 tiles"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Biel Stela Ballester", email = "biel.stela@vizzuality.com" },
]
license = { text = "MIT" }
keywords = ["h3", "GIS", "Tiler"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "h3ronpy>=0.20.2",
    "polars>=0.20",
    "rasterio>=1.3",
    "pydantic>=2.0",
    "click>=8.1",
    "rich",
]
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/vizzuality/h3-tiler"
Issues = "https://github.com/vizzuality/h3-tiler/issues"

[project.optional-dependencies]
dev = ["pre-commit", "pytest"]

[project.scripts]
h3lper = "h3lper.cli.main:cli"

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]
src = ["src"]

[tool.ruff.lint]
select = [
    "D1", # pydocstyle errors
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # flake8
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "N",  # Naming conventions
    "I",  # isort
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in __init__
    "C901", # Too complex
]

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["D103"] # Missing docstring in public function


[tool.mypy]
ignore_missing_imports = true
